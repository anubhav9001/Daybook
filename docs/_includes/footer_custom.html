<script>
  (function () {
    var STATES = ['system', 'light', 'dark'];
    var LABELS = {
      system: '⚙ System',
      light:  '☀ Light',
      dark:   '☽ Dark'
    };
    function getSaved() { try { return localStorage.getItem('daybook-theme'); } catch (e) { return null; } }
    function currentState() {
      var s = getSaved();
      return (s === 'light' || s === 'dark') ? s : 'system';
    }
    function applyState(state) {
      try {
        if (state === 'system') localStorage.removeItem('daybook-theme');
        else localStorage.setItem('daybook-theme', state);
      } catch (e) {}
      if (state === 'light' || state === 'dark') {
        document.documentElement.setAttribute('data-jtd-theme', state);
      } else {
        document.documentElement.removeAttribute('data-jtd-theme');
      }
      var btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.textContent = LABELS[state];
        btn.setAttribute('aria-label', 'Theme: ' + state + '. Click to change.');
      }
    }

    function markExternalLink(a) {
      if (!a || a.dataset.extMarked === '1') return;
      var href = a.getAttribute('href') || '';
      var isExt = /^https?:\/\//i.test(href) && href.indexOf(location.hostname) === -1;
      if (!isExt) return;
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
      var icon = document.createElement('span');
      icon.className = 'ext-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '↗';
      a.appendChild(icon);
      var sr = document.createElement('span');
      sr.className = 'sr-only';
      sr.textContent = ' (opens in new tab)';
      a.appendChild(sr);
      a.dataset.extMarked = '1';
    }

    /* Prefix each sidebar "Important" link with a category icon. */
    function prefixSidebarIcon(a) {
      if (!a || a.dataset.iconAdded === '1') return;
      var txt = (a.textContent || '').trim().toLowerCase();
      var icon = '→'; /* fallback */
      if (txt.indexOf('wiki') > -1 || txt.indexOf('documentation') > -1) icon = '📘';
      else if (txt.indexOf('bug') > -1 || txt.indexOf('report') > -1)    icon = '🐞';
      else if (txt.indexOf('issue') > -1 || txt.indexOf('tracker') > -1) icon = '📋';
      else if (txt.indexOf('discussion') > -1)                            icon = '💬';
      else if (txt.indexOf('github') > -1)                                icon = '⌨';
      else if (txt.indexOf('release') > -1 || txt.indexOf('download') > -1) icon = '⬇';
      var span = document.createElement('span');
      span.className = 'nav-icon';
      span.setAttribute('aria-hidden', 'true');
      span.textContent = icon;
      a.insertBefore(span, a.firstChild);
      a.dataset.iconAdded = '1';
    }

    function addLogo() {
      var title = document.querySelector('.site-header .site-title');
      if (!title || title.querySelector('.site-logo')) return;
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'site-logo');
      svg.setAttribute('viewBox', '0 0 64 64');
      svg.setAttribute('aria-hidden', 'true');
      svg.innerHTML = '<rect width="64" height="64" rx="12" fill="#4b7bec"/>' +
                      '<path d="M18 14h18a14 14 0 0 1 0 28H18V14zm8 8v12h10a6 6 0 0 0 0-12H26z" fill="#ffffff"/>' +
                      '<circle cx="46" cy="48" r="4" fill="#ffffff"/>';
      title.insertBefore(svg, title.firstChild);
    }

    /* Nuclear fix for the search dropdown bleed-through:
       1) Move #search-results to <body> root so NO parent stacking context can trap it.
       2) Pin it as position:fixed under the search input via JS (so it tracks on scroll/resize).
       3) Force opaque background + z-index via inline !important style.
       4) Re-apply on every DOM mutation (JTD rewrites innerHTML on each keystroke)
          and on theme change. */
    function pinSearchResults() {
      var sr = document.getElementById('search-results');
      if (!sr) return;
      if (sr.parentNode !== document.body) document.body.appendChild(sr);

      function reposition() {
        var input = document.getElementById('search-input');
        if (!input) return;
        var rect = input.getBoundingClientRect();
        sr.style.setProperty('position', 'fixed', 'important');
        sr.style.setProperty('top',  (rect.bottom + 6) + 'px', 'important');
        sr.style.setProperty('left', rect.left + 'px', 'important');
        sr.style.setProperty('min-width', Math.max(rect.width, 340) + 'px', 'important');
        sr.style.setProperty('max-width', '560px', 'important');
      }
      function paint() {
        var html = document.documentElement;
        var dark = html.getAttribute('data-jtd-theme') === 'dark'
                || (html.getAttribute('data-jtd-theme') !== 'light'
                    && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var bg = dark ? '#1f1e26' : '#ffffff';
        var fg = dark ? '#f1edf5' : '#15151c';
        sr.style.setProperty('background',       bg, 'important');
        sr.style.setProperty('background-color', bg, 'important');
        sr.style.setProperty('color',            fg, 'important');
        sr.style.setProperty('z-index',          '2147483647', 'important'); /* top */
        sr.style.setProperty('isolation',        'isolate', 'important');
        sr.style.setProperty('backdrop-filter',  'none', 'important');
        sr.style.setProperty('opacity',          '1', 'important');
        reposition();
      }

      /* Keep the keyboard-focused ("active") result scrolled into view. */
      function scrollActiveIntoView() {
        var active = sr.querySelector('.search-result.active');
        if (!active) return;
        if (typeof active.scrollIntoView === 'function') {
          active.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'auto' });
        } else {
          var top = active.offsetTop;
          var bottom = top + active.offsetHeight;
          if (top < sr.scrollTop) sr.scrollTop = top;
          else if (bottom > sr.scrollTop + sr.clientHeight) sr.scrollTop = bottom - sr.clientHeight;
        }
      }

      /* ARIA wiring so screen readers announce the dropdown properly */
      function wireAria() {
        var input = document.getElementById('search-input');
        if (input) {
          input.setAttribute('role', 'combobox');
          input.setAttribute('aria-autocomplete', 'list');
          input.setAttribute('aria-controls', 'search-results');
          input.setAttribute('aria-expanded', sr.children.length > 0 ? 'true' : 'false');
        }
        sr.setAttribute('role', 'listbox');
        sr.querySelectorAll('.search-result').forEach(function (r, i) {
          r.setAttribute('role', 'option');
          r.id = r.id || ('search-result-' + i);
          r.setAttribute('aria-selected', r.classList.contains('active') ? 'true' : 'false');
        });
        var active = sr.querySelector('.search-result.active');
        if (input && active) input.setAttribute('aria-activedescendant', active.id);
        else if (input) input.removeAttribute('aria-activedescendant');
      }

      paint();
      new MutationObserver(function () { paint(); wireAria(); scrollActiveIntoView(); })
        .observe(sr, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
      new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-jtd-theme'] });
      window.addEventListener('scroll',  reposition, { passive: true, capture: true });
      window.addEventListener('resize',  reposition);
    }

    /* Rouge wraps code blocks like
         <div class="language-powershell highlighter-rouge">
           <div class="highlight"><pre class="highlight"><code>…</code></pre></div>
         </div>
       Prism needs the language-xxx class on the <code> element itself.
       Copy it there, then (once Prism finishes loading) highlight everything. */
    function prepareAndRunPrism() {
      document.querySelectorAll('[class*="language-"]').forEach(function (el) {
        var lang = (el.className.match(/language-[\w-]+/) || [])[0];
        if (!lang) return;
        var code = el.querySelector('pre > code, code');
        if (!code) return;
        if (!code.className.match(/language-[\w-]+/)) code.classList.add(lang);
      });

      function extendPowershell() {
        if (!window.Prism || !Prism.languages || !Prism.languages.powershell) return false;
        if (Prism.languages.powershell.__daybookExtended) return true;
        Prism.languages.insertBefore('powershell', 'operator', {
          'parameter': {
            pattern: /(?:^|\s)-[A-Z][A-Za-z0-9]*\b/,
            alias: 'variable'
          }
        });
        Prism.languages.powershell.__daybookExtended = true;
        return true;
      }

      function run() {
        if (window.Prism && typeof Prism.highlightAll === 'function') {
          try {
            /* Wait briefly for the powershell component (loaded by the autoloader)
               to appear, then extend it before we highlight. */
            var tries = 0;
            (function waitPS() {
              if (extendPowershell() || tries++ > 20) {
                Prism.highlightAll();
              } else {
                setTimeout(waitPS, 100);
              }
            })();
          } catch (e) {}
        } else {
          setTimeout(run, 100);
        }
      }
      run();
    }

    /* ======================================================================
       Code-block accessibility
       - One tab stop per code block (not two)
       - Enter/Space on the code pane copies to clipboard
       - aria-live announcement after copy
       ====================================================================== */
    function ensureLiveRegion() {
      var live = document.getElementById('daybook-live-region');
      if (live) return live;
      live = document.createElement('div');
      live.id = 'daybook-live-region';
      live.setAttribute('aria-live', 'polite');
      live.setAttribute('aria-atomic', 'true');
      live.className = 'sr-only';
      document.body.appendChild(live);
      return live;
    }
    function announce(msg) {
      var live = ensureLiveRegion();
      /* Clear then set so repeated identical messages re-announce */
      live.textContent = '';
      setTimeout(function () { live.textContent = msg; }, 10);
    }
    function copyCode(code, trigger) {
      var text = code.innerText || code.textContent || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { announce('Code copied to clipboard'); },
          function () { announce('Copy failed. Press Ctrl+C to copy manually.'); }
        );
      } else {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          announce('Code copied to clipboard');
        } catch (e) {
          announce('Copy failed. Press Ctrl+C to copy manually.');
        }
      }
    }
    function wireCodeBlocks() {
      document.querySelectorAll('.highlighter-rouge, div.highlight').forEach(function (wrap) {
        var pre  = wrap.querySelector('pre');
        var code = wrap.querySelector('pre code, code');
        if (!pre || !code) return;

        /* 1. One tab stop: keep tabindex on <pre> only. */
        wrap.removeAttribute('tabindex');
        var innerHl = wrap.querySelector(':scope > div.highlight');
        if (innerHl) innerHl.removeAttribute('tabindex');
        code.removeAttribute('tabindex');
        if (!pre.hasAttribute('tabindex')) pre.setAttribute('tabindex', '0');
        if (!pre.getAttribute('role')) pre.setAttribute('role', 'region');
        if (!pre.getAttribute('aria-label')) {
          var lang = (wrap.className.match(/language-([\w-]+)/) || [])[1];
          pre.setAttribute('aria-label', (lang ? lang + ' ' : '') + 'code block. Press Enter to copy.');
        }

        /* 2. Enter/Space on the code pane triggers copy */
        if (!pre.dataset.copyBound) {
          pre.addEventListener('keydown', function (e) {
            if ((e.key === 'Enter' || e.key === ' ') && !e.ctrlKey && !e.metaKey) {
              e.preventDefault();
              copyCode(code, pre);
            }
          });
          pre.dataset.copyBound = '1';
        }

        /* 3. Label any button inside this wrapper (whatever its class) */
        wrap.querySelectorAll('button').forEach(function (btn) {
          if (!btn.getAttribute('aria-label') && !btn.textContent.trim()) {
            btn.setAttribute('aria-label', 'Copy code to clipboard');
          }
          btn.setAttribute('type', 'button');
        });
      });
    }

    /* Document-level copy announcement — fires regardless of what triggered
       the clipboard write (JTD's button, our Enter handler, Ctrl+C). */
    function bindGlobalCopyAnnounce() {
      if (window.__daybookCopyBound) return;
      window.__daybookCopyBound = true;
      /* a) Native copy event — fires on Ctrl+C and most execCommand('copy') */
      document.addEventListener('copy', function (e) {
        var sel = window.getSelection && window.getSelection().toString();
        if (sel && sel.length > 0) announce('Copied to clipboard');
      }, true);
      /* b) Delegated click on any button inside a code wrapper */
      document.addEventListener('click', function (e) {
        var btn = e.target.closest && e.target.closest(
          '.highlighter-rouge button, .highlight button, pre + button, pre ~ button, ' +
          '.copy, .copy-code-button, .code-button, button.btn-copy, ' +
          'button[aria-label*="copy" i], button[title*="copy" i]'
        );
        if (btn) {
          /* Give JTD a tick to actually run its copy, then announce. */
          setTimeout(function () { announce('Code copied to clipboard'); }, 50);
        }
      }, true);
    }

    /* Inject the site-wide page footer with trust/legal links. */
    function injectPageFooter() {
      if (document.getElementById('daybook-page-footer')) return;
      var host = document.querySelector('.main-content-wrap') || document.querySelector('.main') || document.body;
      var yr = new Date().getFullYear();
      var footer = document.createElement('footer');
      footer.id = 'daybook-page-footer';
      footer.setAttribute('role', 'contentinfo');
      footer.setAttribute('aria-label', 'Site footer');
      footer.innerHTML =
        '<nav aria-label="Legal and support"><ul class="footer-links">' +
          '<li><a href="/Daybook/privacy.html">Privacy Policy</a></li>' +
          '<li aria-hidden="true" class="footer-sep">·</li>' +
          '<li><a href="/Daybook/terms.html">Terms of Service</a></li>' +
          '<li aria-hidden="true" class="footer-sep">·</li>' +
          '<li><a href="/Daybook/scopes.html">Permissions</a></li>' +
          '<li aria-hidden="true" class="footer-sep">·</li>' +
          '<li><a href="/Daybook/accessibility.html">Accessibility</a></li>' +
          '<li aria-hidden="true" class="footer-sep">·</li>' +
          '<li><a href="https://github.com/anubhav9001/Daybook/blob/main/SECURITY.md" target="_blank" rel="noopener noreferrer">Security</a></li>' +
          '<li aria-hidden="true" class="footer-sep">·</li>' +
          '<li><a href="/Daybook/contact.html">Contact</a></li>' +
        '</ul></nav>' +
        '<div class="footer-meta">' +
          '© ' + yr + ' Daybook &middot; ' +
          '<a href="https://github.com/anubhav9001/Daybook" target="_blank" rel="noopener noreferrer">Source on GitHub</a> &middot; ' +
          'This site uses <a href="https://github.com/just-the-docs/just-the-docs" target="_blank" rel="noopener noreferrer">Just the Docs</a>, a documentation theme for Jekyll.' +
        '</div>';
      host.appendChild(footer);
    }

    /* Make every content table scrollable on narrow viewports and give
       headers explicit scope for screen readers. */
    function improveTables() {
      document.querySelectorAll('.main-content table').forEach(function (table) {
        /* 1. Wrap for horizontal scroll (keeps row integrity on small screens) */
        if (table.parentNode && !table.parentNode.classList.contains('table-wrapper')) {
          var wrap = document.createElement('div');
          wrap.className = 'table-wrapper';
          wrap.setAttribute('role', 'region');
          wrap.setAttribute('tabindex', '0');
          var caption = table.querySelector('caption');
          var captionText = caption ? caption.textContent.trim() : 'Table';
          wrap.setAttribute('aria-label', captionText);
          table.parentNode.insertBefore(wrap, table);
          wrap.appendChild(table);
        }
        /* 2. Explicit scope on <th> cells */
        table.querySelectorAll('thead th, tr:first-child th').forEach(function (th) {
          if (!th.hasAttribute('scope')) th.setAttribute('scope', 'col');
        });
        table.querySelectorAll('tbody th').forEach(function (th) {
          if (!th.hasAttribute('scope')) th.setAttribute('scope', 'row');
        });
      });
    }

    /* Lighthouse / a11y polish */
    function polishMeta() {
      var input = document.getElementById('search-input');
      if (input && input.getAttribute('type') !== 'search') {
        input.setAttribute('type', 'search');
      }
      /* Add " | Daybook" brand suffix to document title and OG/Twitter titles when missing */
      var brand = 'Daybook';
      if (document.title && document.title.indexOf('|') === -1 && document.title.trim() !== brand) {
        document.title = document.title + ' | ' + brand;
      }
      document.querySelectorAll(
        'meta[property="og:title"], meta[name="twitter:title"]'
      ).forEach(function (m) {
        var c = m.getAttribute('content') || '';
        if (c && c.indexOf('|') === -1 && c.trim() !== brand) {
          m.setAttribute('content', c + ' | ' + brand);
        }
      });
    }

    function restructure() {
      addLogo();
      pinSearchResults();
      prepareAndRunPrism();
      ensureLiveRegion();
      bindGlobalCopyAnnounce();
      wireCodeBlocks();
      improveTables();
      injectPageFooter();
      polishMeta();
      /* Re-wire if Prism re-emits code blocks after highlight */
      setTimeout(wireCodeBlocks, 500);
      setTimeout(wireCodeBlocks, 1500);
      /* Move main nav from sidebar into main-header, right after search */
      var siteNav = document.querySelector('.side-bar #site-nav');
      var mainHeader = document.getElementById('main-header');
      var search = mainHeader ? mainHeader.querySelector('.search') : null;
      if (siteNav && mainHeader && search) {
        if (search.nextSibling) mainHeader.insertBefore(siteNav, search.nextSibling);
        else mainHeader.appendChild(siteNav);
        siteNav.setAttribute('aria-label', 'Main');
        siteNav.style.display = ''; /* undo the CSS display:none on the original location */
      }

      /* Move aux-nav into sidebar; name it "Important" (sr-only) */
      var auxNav = document.querySelector('.aux-nav');
      var sideBar = document.querySelector('.side-bar');
      if (auxNav && sideBar && !sideBar.contains(auxNav)) {
        /* Insert before the sidebar footer (JTD credit) if present */
        var sideFooter = sideBar.querySelector('.site-footer');
        if (sideFooter) sideBar.insertBefore(auxNav, sideFooter);
        else sideBar.appendChild(auxNav);
      }
      if (auxNav) {
        auxNav.setAttribute('aria-label', 'Important');
        auxNav.querySelectorAll('a').forEach(function (a) {
          prefixSidebarIcon(a);   /* icon FIRST so it's at the start of the link */
          markExternalLink(a);
        });
      }

      /* Add theme toggle to main-header at the end (visual = DOM order) */
      if (mainHeader && !document.getElementById('theme-toggle')) {
        var btn = document.createElement('button');
        btn.id = 'theme-toggle';
        btn.type = 'button';
        btn.textContent = LABELS[currentState()];
        btn.setAttribute('aria-label', 'Theme: ' + currentState() + '. Click to change.');
        btn.addEventListener('click', function () {
          var idx = STATES.indexOf(currentState());
          applyState(STATES[(idx + 1) % STATES.length]);
        });
        mainHeader.appendChild(btn);
      }

      /* Meaningful name for heading permalinks */
      document.querySelectorAll('.main-content .anchor-heading').forEach(function (a) {
        var h = a.closest('h1,h2,h3,h4,h5,h6');
        var heading = h ? (h.textContent || '').trim() : '';
        a.setAttribute('aria-label', 'Permanent link to ' + heading);
        a.setAttribute('title', 'Permanent link to ' + heading);
        a.removeAttribute('aria-labelledby');
      });

      /* Mark external links everywhere in the content area */
      document.querySelectorAll('.main-content a[href^="http"]').forEach(markExternalLink);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', restructure);
    } else {
      restructure();
    }
  })();
</script>
