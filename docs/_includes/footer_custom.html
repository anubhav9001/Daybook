<script>
  (function () {
    var STATES = ['system', 'light', 'dark'];
    var LABELS = {
      system: '⚙ System',
      light:  '☀ Light',
      dark:   '☽ Dark'
    };
    function getSaved() { try { return localStorage.getItem('daybook-theme'); } catch (e) { return null; } }
    function currentState() {
      var s = getSaved();
      return (s === 'light' || s === 'dark') ? s : 'system';
    }
    function applyState(state) {
      try {
        if (state === 'system') localStorage.removeItem('daybook-theme');
        else localStorage.setItem('daybook-theme', state);
      } catch (e) {}
      if (state === 'light' || state === 'dark') {
        document.documentElement.setAttribute('data-jtd-theme', state);
      } else {
        document.documentElement.removeAttribute('data-jtd-theme');
      }
      var btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.textContent = LABELS[state];
        btn.setAttribute('aria-label', 'Theme: ' + state + '. Click to change.');
      }
    }

    function markExternalLink(a) {
      if (!a || a.dataset.extMarked === '1') return;
      var href = a.getAttribute('href') || '';
      var isExt = /^https?:\/\//i.test(href) && href.indexOf(location.hostname) === -1;
      if (!isExt) return;
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
      var icon = document.createElement('span');
      icon.className = 'ext-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '↗';
      a.appendChild(icon);
      var sr = document.createElement('span');
      sr.className = 'sr-only';
      sr.textContent = ' (opens in new tab)';
      a.appendChild(sr);
      a.dataset.extMarked = '1';
    }

    /* Prefix each sidebar "Important" link with a category icon. */
    function prefixSidebarIcon(a) {
      if (!a || a.dataset.iconAdded === '1') return;
      var txt = (a.textContent || '').trim().toLowerCase();
      var icon = '→'; /* fallback */
      if (txt.indexOf('wiki') > -1 || txt.indexOf('documentation') > -1) icon = '📘';
      else if (txt.indexOf('bug') > -1 || txt.indexOf('report') > -1)    icon = '🐞';
      else if (txt.indexOf('issue') > -1 || txt.indexOf('tracker') > -1) icon = '📋';
      else if (txt.indexOf('discussion') > -1)                            icon = '💬';
      else if (txt.indexOf('github') > -1)                                icon = '⌨';
      else if (txt.indexOf('release') > -1 || txt.indexOf('download') > -1) icon = '⬇';
      var span = document.createElement('span');
      span.className = 'nav-icon';
      span.setAttribute('aria-hidden', 'true');
      span.textContent = icon;
      a.insertBefore(span, a.firstChild);
      a.dataset.iconAdded = '1';
    }

    function restructure() {
      /* Move main nav from sidebar into main-header, right after search */
      var siteNav = document.querySelector('.side-bar #site-nav');
      var mainHeader = document.getElementById('main-header');
      var search = mainHeader ? mainHeader.querySelector('.search') : null;
      if (siteNav && mainHeader && search) {
        if (search.nextSibling) mainHeader.insertBefore(siteNav, search.nextSibling);
        else mainHeader.appendChild(siteNav);
        siteNav.setAttribute('aria-label', 'Main');
        siteNav.style.display = ''; /* undo the CSS display:none on the original location */
      }

      /* Move aux-nav into sidebar; name it "Important" (sr-only) */
      var auxNav = document.querySelector('.aux-nav');
      var sideBar = document.querySelector('.side-bar');
      if (auxNav && sideBar && !sideBar.contains(auxNav)) {
        /* Insert before the sidebar footer (JTD credit) if present */
        var sideFooter = sideBar.querySelector('.site-footer');
        if (sideFooter) sideBar.insertBefore(auxNav, sideFooter);
        else sideBar.appendChild(auxNav);
      }
      if (auxNav) {
        auxNav.setAttribute('aria-label', 'Important');
        auxNav.querySelectorAll('a').forEach(function (a) {
          prefixSidebarIcon(a);   /* icon FIRST so it's at the start of the link */
          markExternalLink(a);
        });
      }

      /* Add theme toggle to main-header at the end (visual = DOM order) */
      if (mainHeader && !document.getElementById('theme-toggle')) {
        var btn = document.createElement('button');
        btn.id = 'theme-toggle';
        btn.type = 'button';
        btn.textContent = LABELS[currentState()];
        btn.setAttribute('aria-label', 'Theme: ' + currentState() + '. Click to change.');
        btn.addEventListener('click', function () {
          var idx = STATES.indexOf(currentState());
          applyState(STATES[(idx + 1) % STATES.length]);
        });
        mainHeader.appendChild(btn);
      }

      /* Meaningful name for heading permalinks */
      document.querySelectorAll('.main-content .anchor-heading').forEach(function (a) {
        var h = a.closest('h1,h2,h3,h4,h5,h6');
        var heading = h ? (h.textContent || '').trim() : '';
        a.setAttribute('aria-label', 'Permanent link to ' + heading);
        a.setAttribute('title', 'Permanent link to ' + heading);
        a.removeAttribute('aria-labelledby');
      });

      /* Mark external links everywhere in the content area */
      document.querySelectorAll('.main-content a[href^="http"]').forEach(markExternalLink);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', restructure);
    } else {
      restructure();
    }
  })();
</script>
