<script>
  (function () {
    // 3-way cycle: System -> Light -> Dark -> System ...
    var STATES = ['system', 'light', 'dark'];
    var LABELS = {
      system: '⚙ System',
      light:  '☀ Light',
      dark:   '☽ Dark'
    };

    function getSaved() {
      try { return localStorage.getItem('daybook-theme'); } catch (e) { return null; }
    }
    function current() {
      var s = getSaved();
      return (s === 'light' || s === 'dark') ? s : 'system';
    }
    function apply(state) {
      try {
        if (state === 'system') localStorage.removeItem('daybook-theme');
        else localStorage.setItem('daybook-theme', state);
      } catch (e) {}
      if (state === 'light' || state === 'dark') {
        document.documentElement.setAttribute('data-jtd-theme', state);
      } else {
        document.documentElement.removeAttribute('data-jtd-theme');
      }
      var btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.textContent = LABELS[state];
        btn.setAttribute('aria-label', 'Theme: ' + state + ' (click to change)');
      }
    }

    function insert() {
      if (document.getElementById('theme-toggle')) return true;
      var list = document.querySelector('.aux-nav .aux-nav-list')
              || document.querySelector('.aux-nav ul');
      if (!list) return false;
      var li = document.createElement('li');
      li.className = 'aux-nav-list-item';
      var btn = document.createElement('button');
      btn.id = 'theme-toggle';
      btn.type = 'button';
      btn.className = 'site-button';
      btn.textContent = LABELS[current()];
      btn.setAttribute('aria-label', 'Theme: ' + current() + ' (click to change)');
      btn.addEventListener('click', function () {
        var idx = STATES.indexOf(current());
        apply(STATES[(idx + 1) % STATES.length]);
      });
      li.appendChild(btn);
      list.appendChild(li);
      return true;
    }

    function boot() {
      if (!insert()) {
        requestAnimationFrame(function () {
          if (!insert()) setTimeout(insert, 100);
        });
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
</script>
