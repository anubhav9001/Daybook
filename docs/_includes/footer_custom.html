<script>
  // Insert a theme toggle button into the top-right aux-nav and wire it up.
  (function () {
    function getTheme() {
      try { return localStorage.getItem('daybook-theme'); } catch (e) { return null; }
    }
    function systemPrefersDark() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    function currentTheme() {
      return getTheme() || (systemPrefersDark() ? 'dark' : 'light');
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-jtd-theme', theme);
      // Note: jtd.setTheme is intentionally NOT called — the dark stylesheet
      // isn't shipped with remote_theme. Our CSS overrides (in head_custom.html)
      // handle the dark palette by targeting html[data-jtd-theme="dark"].
      var btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
        btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
      }
    }

    // Apply once on load (Just the Docs JS is ready by now).
    applyTheme(currentTheme());

    // Add the toggle button to the aux-nav list in the top header.
    var aux = document.querySelector('.aux-nav .aux-nav-list') || document.querySelector('.aux-nav ul');
    if (aux) {
      var li = document.createElement('li');
      li.className = 'aux-nav-list-item';
      var btn = document.createElement('button');
      btn.id = 'theme-toggle';
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Toggle light and dark theme');
      btn.textContent = currentTheme() === 'dark' ? 'Light mode' : 'Dark mode';
      btn.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('daybook-theme', next); } catch (e) {}
        applyTheme(next);
      });
      li.appendChild(btn);
      aux.appendChild(li);
    }

    // Follow system changes only when the user hasn't picked one.
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var listener = function (e) {
        if (!getTheme()) applyTheme(e.matches ? 'dark' : 'light');
      };
      if (mq.addEventListener) mq.addEventListener('change', listener);
      else if (mq.addListener) mq.addListener(listener);
    }
  })();
</script>
