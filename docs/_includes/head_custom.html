<script>
  // Pre-paint: if the user has an explicit choice, apply it as data-jtd-theme.
  // If no choice is saved, the @media rule below handles system preference
  // automatically — no JS needed.
  (function () {
    try {
      var saved = localStorage.getItem('daybook-theme'); // 'light' | 'dark' | null
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-jtd-theme', saved);
      }
    } catch (e) {}
  })();
</script>
