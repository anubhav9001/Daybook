<script>
  (function () {
    try {
      var saved = localStorage.getItem('daybook-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-jtd-theme', saved);
      }
    } catch (e) {}
  })();
</script>
<style>
  /* ========================================================================
     Palette
     ======================================================================== */
  :root {
    --jtd-bg:        #1b1b22;
    --jtd-bg-side:   #141418;
    --jtd-bg-head:   #27262b;
    --jtd-surface:   #2f2f36;
    --jtd-surface-2: #26262d;
    --jtd-border:    #3a3942;
    --jtd-text:      #e6e1e8;
    --jtd-text-dim:  #a79fb0;
    --jtd-heading:   #ffffff;
    --jtd-link:      #92b4ff;
    --jtd-link-hvr:  #b7ccff;
    --jtd-primary:   #4b7bec;
    --jtd-focus:     #ffbf47;
  }

  /* ========================================================================
     Accessibility: visually-hidden utility (used for aria-only text)
     ======================================================================== */
  .sr-only, .visually-hidden {
    position: absolute !important;
    width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important;
    overflow: hidden !important; clip: rect(0,0,0,0) !important;
    white-space: nowrap !important; border: 0 !important;
  }

  /* ========================================================================
     Focus — tight ring on the element itself, never covering extra area
     ======================================================================== */
  *:focus { outline: none; }
  *:focus-visible {
    outline: 2px solid var(--jtd-focus);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .btn:focus-visible,
  .btn-primary:focus-visible {
    outline: 2px solid var(--jtd-focus);
    outline-offset: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.9);
  }
  .nav-list-link:focus-visible,
  .aux-nav .site-button:focus-visible {
    outline: 2px solid var(--jtd-focus);
    outline-offset: -2px; /* inside the element so it only outlines the item itself */
  }

  /* ========================================================================
     Layout — main nav horizontal in header; "Important" vertical in sidebar
     ======================================================================== */
  .main-header {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    align-items: center;
    padding: 10px 20px;
  }
  .main-header .search { flex: 0 1 220px; min-width: 160px; max-width: 260px; }
  .main-header .site-nav {
    flex: 1 1 auto;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
  }
  .main-header .site-nav .nav-list {
    display: flex;
    flex-wrap: nowrap;      /* keep on one line */
    margin: 0;
    padding: 0;
    list-style: none;
    gap: 2px;
    white-space: nowrap;
  }
  .main-header .site-nav .nav-list-item { margin: 0; }
  .main-header .site-nav .nav-list-link {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 6px;
    white-space: nowrap;
    font-weight: 500;
    text-decoration: none;
    background-image: none !important;
  }
  .main-header .site-nav .nav-list-link:hover {
    background: rgba(127,127,127,0.12);
  }
  .main-header .site-nav .nav-list-link.active {
    background: rgba(75,123,236,0.15);
    color: var(--jtd-primary);
    font-weight: 600;
  }
  .main-header .site-nav .nav-list .nav-list { display: none; }

  /* Sidebar: give header room, then push Just-the-Docs credit to bottom */
  .side-bar {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .side-bar > .site-header { flex: 0 0 auto; }
  .side-bar > #site-nav { display: none !important; } /* moved out by JS */

  /* "Important" vertical list in sidebar — plain text LINK style with icons */
  .side-bar .aux-nav {
    display: block !important;
    padding: 8px 20px !important;
    margin: 4px 0 0 !important;
    height: auto !important;
    position: static !important;      /* undo JTD's absolute positioning */
    background: none !important;
  }
  .side-bar .aux-nav .aux-nav-list {
    display: flex !important;
    flex-direction: column !important;
    gap: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    list-style: none !important;
    height: auto !important;
  }
  .side-bar .aux-nav .aux-nav-list-item {
    margin: 0 !important;
    padding: 0 !important;
    line-height: 1.3 !important;
  }
  /* Override JTD's .site-button: strip to a plain anchor */
  .side-bar .aux-nav a.site-button {
    display: inline-flex !important;
    align-items: baseline !important;
    gap: 6px !important;
    width: auto !important;
    min-width: 0 !important;
    height: auto !important;
    min-height: 0 !important;
    padding: 3px 2px !important;
    margin: 2px 0 !important;
    background: none !important;
    background-image: none !important;
    box-shadow: none !important;
    border: 0 !important;
    border-radius: 3px !important;
    text-align: left !important;
    font-weight: normal !important;
    font-size: 0.95em !important;
    line-height: 1.3 !important;
    text-decoration: none !important;
    color: inherit !important;
    vertical-align: baseline !important;
  }
  .side-bar .aux-nav a.site-button:hover,
  .side-bar .aux-nav a.site-button:focus-visible {
    text-decoration: underline !important;
    background: none !important;
  }
  /* Keep focus ring tight to the actual text box */
  .side-bar .aux-nav a.site-button:focus-visible {
    outline: 2px solid var(--jtd-focus) !important;
    outline-offset: 1px !important;
  }
  .side-bar .aux-nav .nav-icon {
    flex: 0 0 1.2em;
    display: inline-block;
    text-align: center;
    font-size: 0.95em;
    opacity: 0.9;
  }
  .side-bar .aux-nav .ext-icon {
    flex: 0 0 auto;
    font-size: 0.75em;
    margin-left: 2px;
    opacity: 0.6;
  }

  /* Push the "Just the Docs" credit to the sidebar bottom */
  .side-bar .site-footer {
    display: block !important;        /* show on all breakpoints */
    margin-top: auto;                 /* pushes to bottom */
    padding: 16px 20px;
    font-size: 12px;
    opacity: 0.65;
    border-top: 1px solid rgba(127,127,127,0.2);
  }
  /* Hide the duplicate footer credit that JTD adds in main-content area */
  footer .d-md-none { display: none !important; }

  /* ========================================================================
     Theme toggle button
     ======================================================================== */
  #theme-toggle {
    flex: 0 0 auto;
    background: transparent;
    color: inherit;
    border: 1px solid currentColor;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    opacity: 0.85;
    white-space: nowrap;
  }
  #theme-toggle:hover { opacity: 1; }

  /* ========================================================================
     Permalink icons on headings — understated, meaningful
     ======================================================================== */
  .anchor-heading {
    opacity: 0;
    transition: opacity 0.15s ease;
    margin-left: 8px;
    text-decoration: none;
    vertical-align: middle;
  }
  h1:hover .anchor-heading, h2:hover .anchor-heading, h3:hover .anchor-heading,
  h4:hover .anchor-heading, h5:hover .anchor-heading, h6:hover .anchor-heading,
  .anchor-heading:focus, .anchor-heading:focus-visible { opacity: 0.7; }

  /* ========================================================================

     ======================================================================== */
  @media (prefers-color-scheme: dark) {
    html:not([data-jtd-theme="light"]) { color-scheme: dark; }
  }
  html[data-jtd-theme="dark"] { color-scheme: dark; }

  /* Shared helpers to avoid duplication: one @media + one explicit block */

    html:not([data-jtd-theme="light"]),
    html:not([data-jtd-theme="light"]) body,
    html:not([data-jtd-theme="light"]) .main,
    html:not([data-jtd-theme="light"]) .main-content-wrap,

    }
    html:not([data-jtd-theme="light"]) .site-title,
    html:not([data-jtd-theme="light"]) #menu-button { color: var(--jtd-heading) !important; }
    html:not([data-jtd-theme="light"]) .site-footer { color: var(--jtd-text-dim) !important; border-color: var(--jtd-border) !important; }
    html:not([data-jtd-theme="light"]) .site-footer a { color: var(--jtd-link) !important; }

    html:not([data-jtd-theme="light"]) .main-header .site-nav .nav-list-link { color: var(--jtd-text) !important; }
    html:not([data-jtd-theme="light"]) .main-header .site-nav .nav-list-link:hover {
      background: var(--jtd-surface-2) !important;
      color: var(--jtd-heading) !important;
    }
    html:not([data-jtd-theme="light"]) .main-header .site-nav .nav-list-link.active {
      background: rgba(75,123,236,0.18) !important;
      color: var(--jtd-link) !important;
    }
    html:not([data-jtd-theme="light"]) .side-bar .aux-nav a.site-button { color: var(--jtd-text) !important; background: none !important; }
    html:not([data-jtd-theme="light"]) .side-bar .aux-nav a.site-button:hover,
    html:not([data-jtd-theme="light"]) .side-bar .aux-nav a.site-button:focus-visible {
      color: var(--jtd-link-hvr) !important;
      text-decoration: underline !important;
    }

    html:not([data-jtd-theme="light"]) .main-content p,
    html:not([data-jtd-theme="light"]) .main-content li { color: var(--jtd-text) !important; }
    html:not([data-jtd-theme="light"]) .main-content a,
    html:not([data-jtd-theme="light"]) .main-content a:visited { color: var(--jtd-link) !important; }
    html:not([data-jtd-theme="light"]) .main-content a:hover { color: var(--jtd-link-hvr) !important; }
    html:not([data-jtd-theme="light"]) .main-content h1,
    html:not([data-jtd-theme="light"]) .main-content h2,
    html:not([data-jtd-theme="light"]) .main-content h3,
    html:not([data-jtd-theme="light"]) .main-content h4,
    html:not([data-jtd-theme="light"]) .main-content h5,
    html:not([data-jtd-theme="light"]) .main-content h6 { color: var(--jtd-heading) !important; }
    html:not([data-jtd-theme="light"]) hr { border-color: var(--jtd-border) !important; }

    html:not([data-jtd-theme="light"]) .search-input {
      background-color: var(--jtd-bg) !important;
      color: var(--jtd-text) !important;
      border: 1px solid var(--jtd-border) !important;
    }
    html:not([data-jtd-theme="light"]) .search-input::placeholder { color: var(--jtd-text-dim) !important; }
    html:not([data-jtd-theme="light"]) .search,
    html:not([data-jtd-theme="light"]) .search-input-wrap,
    html:not([data-jtd-theme="light"]) .search-label { background-color: transparent !important; }
    html:not([data-jtd-theme="light"]) .search-results { background-color: var(--jtd-bg-head) !important; color: var(--jtd-text) !important; }

    html:not([data-jtd-theme="light"]) code,
    html:not([data-jtd-theme="light"]) .highlight,
    html:not([data-jtd-theme="light"]) pre.highlight,
    html:not([data-jtd-theme="light"]) pre { background-color: var(--jtd-surface) !important; color: var(--jtd-text) !important; }

    html:not([data-jtd-theme="light"]) .btn {
      color: var(--jtd-text) !important;
      background-color: var(--jtd-surface) !important;
      background-image: none !important;
      box-shadow: none !important;
      border: 1px solid var(--jtd-border) !important;
    }
    html:not([data-jtd-theme="light"]) .btn:hover { background-color: var(--jtd-border) !important; }
    html:not([data-jtd-theme="light"]) .btn-primary {
      background-color: var(--jtd-primary) !important;
      color: #ffffff !important;
      border-color: var(--jtd-primary) !important;
    }
    html:not([data-jtd-theme="light"]) .btn:focus-visible {
      outline: 2px solid var(--jtd-focus) !important;
      outline-offset: 3px !important;
      box-shadow: 0 0 0 1px #000 !important;
    }

    html:not([data-jtd-theme="light"]) table th,
    html:not([data-jtd-theme="light"]) table td { border-color: var(--jtd-border) !important; color: var(--jtd-text) !important; }
    html:not([data-jtd-theme="light"]) table th { background-color: var(--jtd-surface) !important; }
    html:not([data-jtd-theme="light"]) table tr:nth-child(2n) { background-color: var(--jtd-surface-2) !important; }
    html:not([data-jtd-theme="light"]) blockquote { color: var(--jtd-text-dim) !important; border-left-color: var(--jtd-border) !important; }

    html:not([data-jtd-theme="light"]) ::-webkit-scrollbar { background: var(--jtd-bg); width: 10px; height: 10px; }
    html:not([data-jtd-theme="light"]) ::-webkit-scrollbar-thumb { background: var(--jtd-surface); border-radius: 4px; }
    html:not([data-jtd-theme="light"]) ::-webkit-scrollbar-thumb:hover { background: var(--jtd-border); }
    html:not([data-jtd-theme="light"]) .anchor-heading { color: var(--jtd-link) !important; }
  }

  html[data-jtd-theme="dark"],
  html[data-jtd-theme="dark"] body,
  html[data-jtd-theme="dark"] .main,
  html[data-jtd-theme="dark"] .main-content-wrap,
  html[data-jtd-theme="dark"] .main-content {
    background-color: var(--jtd-bg) !important;
    color: var(--jtd-text) !important;
  }

    border-bottom: 1px solid var(--jtd-border) !important;

  html[data-jtd-theme="dark"] #menu-button { color: var(--jtd-heading) !important; }

  html[data-jtd-theme="dark"] .site-footer a { color: var(--jtd-link) !important; }

  html[data-jtd-theme="dark"] .main-header .site-nav .nav-list-link.active { background: rgba(75,123,236,0.18) !important; color: var(--jtd-link) !important; }
  html[data-jtd-theme="dark"] .side-bar .aux-nav a.site-button { color: var(--jtd-text) !important; background: none !important; }
  html[data-jtd-theme="dark"] .side-bar .aux-nav a.site-button:hover,
  html[data-jtd-theme="dark"] .side-bar .aux-nav a.site-button:focus-visible { color: var(--jtd-link-hvr) !important; text-decoration: underline !important; }
  html[data-jtd-theme="dark"] .main-content p,
  html[data-jtd-theme="dark"] .main-content li { color: var(--jtd-text) !important; }
  html[data-jtd-theme="dark"] .main-content a,
  html[data-jtd-theme="dark"] .main-content a:visited { color: var(--jtd-link) !important; }
  html[data-jtd-theme="dark"] .main-content a:hover { color: var(--jtd-link-hvr) !important; }
  html[data-jtd-theme="dark"] .main-content h1,
  html[data-jtd-theme="dark"] .main-content h2,
  html[data-jtd-theme="dark"] .main-content h3,
  html[data-jtd-theme="dark"] .main-content h4,
  html[data-jtd-theme="dark"] .main-content h5,
  html[data-jtd-theme="dark"] .main-content h6 { color: var(--jtd-heading) !important; }
  html[data-jtd-theme="dark"] hr { border-color: var(--jtd-border) !important; }
  html[data-jtd-theme="dark"] .search-input { background-color: var(--jtd-bg) !important; color: var(--jtd-text) !important; border: 1px solid var(--jtd-border) !important; }

  html[data-jtd-theme="dark"] .search,

  html[data-jtd-theme="dark"] code,
  html[data-jtd-theme="dark"] .highlight,
  html[data-jtd-theme="dark"] pre.highlight,
  html[data-jtd-theme="dark"] pre { background-color: var(--jtd-surface) !important; color: var(--jtd-text) !important; }
  html[data-jtd-theme="dark"] .btn { color: var(--jtd-text) !important; background-color: var(--jtd-surface) !important; background-image: none !important; box-shadow: none !important; border: 1px solid var(--jtd-border) !important; }
  html[data-jtd-theme="dark"] .btn:hover { background-color: var(--jtd-border) !important; }

  html[data-jtd-theme="dark"] table tr:nth-child(2n) { background-color: var(--jtd-surface-2) !important; }
  html[data-jtd-theme="dark"] blockquote { color: var(--jtd-text-dim) !important; border-left-color: var(--jtd-border) !important; }

</style>
