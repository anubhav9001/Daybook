<style>
  /* ========================================================================
     Palette
     ======================================================================== */
  :root {
    --jtd-bg:        #15151c;        /* darker base for stronger contrast */
    --jtd-bg-side:   #0f0f14;
    --jtd-bg-head:   #1f1e26;
    --jtd-surface:   #2a2932;
    --jtd-surface-2: #22222a;
    --jtd-border:    #44434e;        /* more visible borders */
    --jtd-text:      #f1edf5;        /* near-white body text ≈15:1 on bg */
    --jtd-text-dim:  #bdb6c6;        /* dim text still readable ≈8:1 */
    --jtd-heading:   #ffffff;
    --jtd-link:      #a9c1ff;        /* brighter link ≈9:1 */
    --jtd-link-hvr:  #ccdcff;
    --jtd-primary:   #5a89ff;
    --jtd-focus:     #0a0a0f;   /* light-mode: deep near-black ring */
    --jtd-focus-dark:#ffcc33;   /* dark-mode: amber ring */
  }
  /* Dark theme swaps the focus ring to amber */
  @media (prefers-color-scheme: dark) {
    html:not([data-jtd-theme="light"]) { --jtd-focus: var(--jtd-focus-dark); }
  }
  html[data-jtd-theme="dark"] { --jtd-focus: var(--jtd-focus-dark); }

  /* Light-mode link color override (previous value was dark-mode only).
     --jtd-link gets a dark enough blue for AA contrast on white. */
  html[data-jtd-theme="light"] {
    --jtd-link:     #1a4fcf;    /* 7:1 on #ffffff */
    --jtd-link-hvr: #0d2d8a;
  }
  @media (prefers-color-scheme: light) {
    html:not([data-jtd-theme="dark"]) {
      --jtd-link:     #1a4fcf;
      --jtd-link-hvr: #0d2d8a;
    }
  }

  /* ========================================================================
     Accessibility: visually-hidden utility (used for aria-only text)
     ======================================================================== */
  .sr-only, .visually-hidden {
    position: absolute !important;
    width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important;
    overflow: hidden !important; clip: rect(0,0,0,0) !important;
    white-space: nowrap !important; border: 0 !important;
  }

  /* ========================================================================
     Focus — tight ring on the element itself, never covering extra area
     ======================================================================== */
  *:focus { outline: none; }
  *:focus-visible {
    outline: 2px solid var(--jtd-focus);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .btn:focus-visible,
  .btn-primary:focus-visible {
    outline: 2px solid var(--jtd-focus);
    outline-offset: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.9);
  }
  .nav-list-link:focus-visible,
  .aux-nav .site-button:focus-visible {
    outline: 2px solid var(--jtd-focus);
    outline-offset: -2px; /* inside the element so it only outlines the item itself */
  }

  /* ========================================================================
     Layout — main nav horizontal in header; "Important" vertical in sidebar
     ======================================================================== */
  .main-header {
    display: flex;
    flex-wrap: nowrap;             /* desktop: single row */
    gap: 6px 10px;
    align-items: center;
    padding: 6px 14px;
    min-height: 48px;
    /* IMPORTANT: don't use overflow:hidden here — search dropdown must escape */
    position: relative;
  }
  /* MOBILE: allow wrapping so search + nav + toggle stack cleanly */
  @media (max-width: 49.99rem) {
    .main-header {
      flex-wrap: wrap !important;
      gap: 8px !important;
      padding: 8px 12px !important;
    }
    .main-header .search {
      flex: 1 1 100% !important;
      max-width: none !important;
      min-width: 0 !important;
      order: 2;
    }
    .main-header .site-nav {
      flex: 1 1 100% !important;
      order: 3;
      overflow-x: auto;              /* horizontal scroll instead of overflow:hidden */
      -webkit-overflow-scrolling: touch;
    }
    .main-header .site-nav .nav-list { flex-wrap: nowrap; }
    #theme-toggle {
      order: 1;
      margin-left: auto;             /* right-aligned next to hamburger */
    }
    /* Make the search input taller for touch */
    .main-header .search-input { min-height: 44px; }
  }
  .main-header .search { position: relative; }
  .search-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: auto;
    min-width: 320px;
    z-index: 1000;
  }
  .main-header .search {
    flex: 0 1 200px;
    min-width: 140px;
    max-width: 220px;
  }
  .main-header .site-nav {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;              /* no horizontal scrollbar */
  }
  .main-header .site-nav .nav-list {
    display: flex;
    flex-wrap: nowrap;
    margin: 0;
    padding: 0;
    list-style: none;
    gap: 0;
    white-space: nowrap;
    overflow: hidden;
  }
  .main-header .site-nav .nav-list-item { margin: 0; }
  .main-header .site-nav .nav-list-link {
    display: inline-flex;
    align-items: center;
    min-height: 36px;
    padding: 8px 12px;
    border-radius: 6px;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    background-image: none !important;
  }
  /* Mobile: raise to 44x44 WCAG tap-target recommendation */
  @media (max-width: 50rem) {
    .main-header .site-nav .nav-list-link { min-height: 44px; padding: 10px 14px; }
  }
  .main-header .site-nav .nav-list-link:hover {
    background: rgba(127,127,127,0.12);
  }
  .main-header .site-nav .nav-list-link.active {
    background: rgba(75,123,236,0.15);
    color: var(--jtd-primary);
    font-weight: 600;
  }
  .main-header .site-nav .nav-list .nav-list { display: none; }

  /* Sidebar: give header room, then push Just-the-Docs credit to bottom */
  .side-bar {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .side-bar > .site-header { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .side-bar > #site-nav { display: none !important; } /* moved out by JS */

  /* Daybook title + logo */
  .site-title {
    display: inline-flex !important;
    align-items: center;
    gap: 8px;
    padding: 4px 6px !important;
    border-radius: 6px;
    background: transparent !important;
    background-image: none !important;
    text-decoration: none !important;
  }
  .site-title:hover {
    background: rgba(127,127,127,0.1) !important;
    background-image: none !important;
  }
  .site-logo {
    width: 28px;
    height: 28px;
    flex: 0 0 auto;
    display: inline-block;
  }

  /* Mobile hamburger button — ensure it's at least 44x44 and clearly visible */
  @media (max-width: 49.99rem) {
    #menu-button {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 10px !important;
      margin-left: auto;
      border: 1px solid currentColor !important;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }
    #menu-button:focus-visible {
      outline: 2px solid var(--jtd-focus) !important;
      outline-offset: 2px !important;
    }
    #menu-button .icon { width: 20px; height: 20px; }
  }
  @media (min-width: 50rem) {
    /* Hide the hamburger on desktop (sidebar is permanently visible) */
    #menu-button { display: none !important; }
  }

  /* ========================================================================
     Mobile general polish
     ======================================================================== */
  @media (max-width: 49.99rem) {
    html, body { overflow-x: hidden; }           /* no horizontal scroll of the page */
    .main-content { padding: 16px !important; }
    .main-content h1 { font-size: 1.9rem !important; line-height: 1.2; }
    .main-content h2 { font-size: 1.4rem !important; }
    .main-content h3 { font-size: 1.15rem !important; }
    .main-content p,
    .main-content li { font-size: 1rem; line-height: 1.55; }

    /* Buttons full-width on narrow screens for easier tapping */
    .main-content .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 16px !important;
    }

    /* Form inputs & textareas full-width + 44px minimum */
    #contact-form input[type="text"],
    #contact-form input[type="email"],
    #contact-form textarea {
      min-height: 44px;
      font-size: 16px;                     /* 16px prevents iOS auto-zoom */
    }
    #contact-form textarea { min-height: 160px; }
    #contact-form .btn { width: 100%; }
    #contact-form .form-actions { flex-direction: column; align-items: stretch; }

    /* Footer: let legal links wrap on mobile (don't force one line here) */
    #daybook-page-footer .footer-links { flex-wrap: wrap !important; overflow-x: visible !important; }
    #daybook-page-footer .footer-links li { white-space: nowrap; }
    #daybook-page-footer { padding: 20px 16px 28px; }

    /* Dim backdrop when sidebar overlay is open (Daybook JS adds the class) */
    body.daybook-sidebar-open::after {
      content: "";
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 50;
      backdrop-filter: blur(1px);
    }
    body.daybook-sidebar-open { overflow: hidden; }   /* lock scroll under overlay */
    .side-bar { z-index: 60; }   /* above the backdrop */
  }

  /* Sidebar width — DESKTOP only. Mobile keeps JTD's slide-in overlay. */
  @media (min-width: 50rem) {
    .side-bar { width: 250px; }
    .main { margin-left: 250px; }
  }
  @media (max-width: 49.99rem) {
    /* Un-push the main area so content isn't shifted when the sidebar is closed */
    .main { margin-left: 0 !important; }
    /* Give the slide-in sidebar a reasonable mobile width */
    .side-bar {
      width: 86% !important;
      max-width: 320px;
      box-shadow: 2px 0 24px rgba(0,0,0,0.25);
    }
  }

  /* "Important" vertical list in sidebar — plain text LINK style with icons */
  .side-bar .aux-nav {
    display: block !important;
    padding: 10px 18px !important;
    margin: 4px 0 0 !important;
    height: auto !important;
    position: static !important;
    background: none !important;
  }
  .side-bar .aux-nav .aux-nav-list {
    display: flex !important;
    flex-direction: column !important;
    gap: 2px !important;
    margin: 0 !important;
    padding: 0 !important;
    list-style: none !important;
    height: auto !important;
  }
  .side-bar .aux-nav .aux-nav-list-item {
    margin: 0 !important;
    padding: 0 !important;
    line-height: 1.4 !important;
  }
  /* Override JTD's .site-button: strip to a plain anchor at proper reading size */
  .side-bar .aux-nav a.site-button {
    display: inline-flex !important;
    align-items: center !important;
    gap: 10px !important;
    width: auto !important;
    min-width: 0 !important;
    height: auto !important;
    min-height: 0 !important;
    padding: 6px 4px !important;
    margin: 2px 0 !important;
    background: none !important;
    background-image: none !important;
    box-shadow: none !important;
    border: 0 !important;
    border-radius: 4px !important;
    text-align: left !important;
    font-weight: 500 !important;
    font-size: 15px !important;          /* up from ~13px to match body copy */
    line-height: 1.4 !important;
    text-decoration: none !important;
    color: inherit !important;
    vertical-align: middle !important;
  }
  .side-bar .aux-nav a.site-button:hover,
  .side-bar .aux-nav a.site-button:focus-visible {
    text-decoration: underline !important;
    background: none !important;
  }
  .side-bar .aux-nav a.site-button:focus-visible {
    outline: 2px solid var(--jtd-focus) !important;
    outline-offset: 2px !important;
  }
  .side-bar .aux-nav .nav-icon {
    flex: 0 0 1.4em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.2em;                   /* bigger emoji icons */
    line-height: 1;
    opacity: 1;
  }
  .side-bar .aux-nav .ext-icon {
    flex: 0 0 auto;
    font-size: 0.9em;                   /* up from 0.75em */
    margin-left: 2px;
    opacity: 0.7;
  }
  /* Mobile: push to 44px tap-target */
  @media (max-width: 50rem) {
    .side-bar .aux-nav a.site-button {
      padding: 10px 4px !important;
      font-size: 16px !important;
    }
    .side-bar .aux-nav .nav-icon { font-size: 1.25em; }
  }

  /* Hide the sidebar "Just the Docs" credit — moved to the page footer */
  .side-bar .site-footer { display: none !important; }

  /* ========================================================================
     Page-wide footer with Google-verification-grade links
     ======================================================================== */
  #daybook-page-footer {
    margin: 48px auto 0;
    padding: 24px 24px 32px;
    border-top: 1px solid #d4d7dc;
    font-size: 14px;
    color: #4a4751;                   /* 8:1 on white */
    background: transparent;
  }
  #daybook-page-footer .footer-links {
    display: flex;
    flex-wrap: nowrap;              /* single row */
    gap: 10px 14px;
    margin: 0 0 12px;
    padding: 0 0 4px;
    list-style: none;
    align-items: center;
    overflow-x: auto;                /* horizontal scroll if the viewport is tight */
    white-space: nowrap;
    scrollbar-width: thin;
  }
  #daybook-page-footer .footer-links li { white-space: nowrap; }
  #daybook-page-footer .footer-links a {
    color: #1a4fcf !important;        /* 7:1 on white */
    text-decoration: none;
  }
  #daybook-page-footer .footer-links a:hover,
  #daybook-page-footer .footer-links a:focus-visible {
    text-decoration: underline;
    color: #0d2d8a !important;
  }
  #daybook-page-footer .footer-sep {
    opacity: 0.4;
    user-select: none;
  }
  #daybook-page-footer .footer-meta {
    font-size: 12.5px;
    color: #4a4751;
    opacity: 0.85;
  }
  #daybook-page-footer .footer-meta a {
    color: #1a4fcf !important;
    text-decoration: underline;
  }
  /* Hide the duplicate footer credit that JTD adds in main-content area */
  footer .d-md-none { display: none !important; }

  /* ========================================================================
     Theme toggle button — compact
     ======================================================================== */
  #theme-toggle {
    flex: 0 0 auto;
    background: transparent;
    color: inherit;
    border: 1px solid currentColor;
    border-radius: 16px;
    padding: 3px 10px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    opacity: 0.85;
    white-space: nowrap;
  }
  #theme-toggle:hover { opacity: 1; }

  /* ========================================================================
     Search results dropdown — ID-selector wins JTD's own rules
     ======================================================================== */
  #search-results.search-results,
  #search-results {
    margin-top: 4px !important;
    border-radius: 8px !important;
    border: 1px solid rgba(127,127,127,0.35) !important;
    box-shadow: 0 10px 32px rgba(0,0,0,0.35) !important;
    max-height: 70vh !important;
    overflow: auto !important;
    background: #ffffff !important;
    background-color: #ffffff !important;
    padding: 4px !important;
    z-index: 9999 !important;
    isolation: isolate;              /* new stacking context */
  }
  .search-results-list {
    padding: 0 !important;
    margin: 0 !important;
    list-style: none !important;
  }
  .search-results-list-item { margin: 0 !important; padding: 0 !important; }

  /* Simple block layout — no grid, no display:contents. */
  .search-result {
    display: block !important;
    padding: 10px 12px 10px 44px !important;    /* leave 44px for the icon on the left */
    margin: 2px 0 !important;
    position: relative !important;
    text-decoration: none !important;
    border-radius: 6px !important;
    color: inherit !important;
    background: transparent !important;
    background-image: none !important;
    border: 0 !important;
    line-height: 1.4 !important;
  }
  .search-result:hover { background: rgba(75,123,236,0.08) !important; }
  .search-result.active,
  .search-result:focus,
  .search-result:focus-visible {
    background: rgba(75,123,236,0.14) !important;
    outline: 2px solid var(--jtd-focus) !important;
    outline-offset: -2px !important;
    position: relative !important;
    z-index: 1 !important;
  }

  /* Reset JTD's inner wrappers to normal block flow */
  .search-result-doc,
  .search-result-section,
  .search-result-previews,
  .search-result-doc-title,
  .search-result-doc-parent,
  .search-result-section-title,
  .search-result-rel-url,
  .search-result-preview {
    display: block !important;
    width: auto !important;
    max-width: none !important;
    min-width: 0 !important;
    writing-mode: horizontal-tb !important;
    text-orientation: mixed !important;
    white-space: normal !important;
    word-break: normal !important;
    overflow-wrap: break-word !important;
    margin: 0 !important;
    padding: 0 !important;
    float: none !important;
    position: static !important;
  }

  .search-result-icon {
    position: absolute !important;
    left: 12px !important;
    top: 12px !important;
    width: 20px !important;
    height: 20px !important;
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    opacity: 0.55;
  }
  .search-result-icon svg { width: 16px !important; height: 16px !important; }

  .search-result-doc-title { font-weight: 600 !important; font-size: 14px !important; }
  .search-result-doc-parent { font-size: 11px !important; opacity: 0.65; margin-top: 1px !important; }
  .search-result-section { margin-top: 4px !important; }
  .search-result-section-title { font-weight: 600 !important; font-size: 13px !important; }
  .search-result-rel-url { font-size: 10.5px !important; opacity: 0.6; margin-top: 1px !important; }
  .search-result-previews {
    margin: 6px 0 0 !important;
    padding: 0 0 0 10px !important;
    font-size: 12px !important;
    opacity: 0.9;
    border-left: 2px solid rgba(127,127,127,0.25);
    list-style: none !important;
  }
  .search-result-preview { margin: 2px 0 !important; }
  .search-result-highlight { color: var(--jtd-primary); font-weight: 600; }
  .search-no-result {
    padding: 14px !important;
    opacity: 0.7;
    font-style: italic;
    text-align: center;
  }

  /* ========================================================================
     Tables — accessible defaults in BOTH themes
     - High-contrast header (bold, distinct background)
     - Visible cell borders
     - Zebra stripes that keep AA text contrast
     - Responsive: horizontal scroll on narrow viewports (keeps row integrity)
     - Row hover for easier scanning
     ======================================================================== */
  .main-content table,
  .table-wrapper table {
    border-collapse: collapse !important;
    width: 100%;
    margin: 1em 0;
    display: table !important;
    background-image: none !important;
    box-shadow: none !important;
  }
  .main-content table caption,
  .table-wrapper table caption {
    text-align: left;
    font-weight: 600;
    padding: 4px 8px 8px;
    caption-side: top;
  }
  .main-content table th,
  .table-wrapper table th {
    background: #eef0f4 !important;      /* 1.08:1 to white — purely for visual grouping; text contrast carries meaning */
    color: #1b1f24 !important;            /* 15.6:1 on #eef0f4 — AAA */
    font-weight: 700 !important;
    text-align: left;
    padding: 10px 12px !important;
    border: 1px solid #c8ccd3 !important;  /* 3.1:1 vs white — meets non-text contrast */
    vertical-align: top;
  }
  .main-content table td,
  .table-wrapper table td {
    color: #24292e !important;            /* 14.9:1 on white — AAA */
    padding: 10px 12px !important;
    border: 1px solid #d4d7dc !important;
    vertical-align: top;
    background: #ffffff;
  }
  .main-content table tr:nth-child(2n) td,
  .table-wrapper table tr:nth-child(2n) td {
    background: #f6f8fa !important;      /* zebra; text still AAA on #f6f8fa */
  }
  /* Mobile wrapper: scroll instead of overflow-breaking the layout */
  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 1em 0;
    border-radius: 6px;
  }

  /* ========================================================================
     Keyboard-shortcut keys — use the site's default sans-serif, styled
     like key caps. Works whether the author wrote `Ctrl` (inline code) or
     <kbd>Ctrl</kbd> inside a table cell.
     ======================================================================== */
  .main-content table td code,
  .main-content table th code,
  .main-content kbd,
  kbd {
    font-family: inherit !important;      /* match the body font */
    font-size: 0.92em !important;
    font-weight: 600 !important;
    padding: 2px 7px !important;
    border-radius: 4px !important;
    background: #f1f3f6 !important;
    color: #1b1f24 !important;
    border: 1px solid #c8ccd3 !important;
